
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - AWS DevOps</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 50px 60px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 45px;
            margin-bottom: 20px;
        }

        h1 {
            color: #2563eb;
            font-size: 36px;
            margin-bottom: 12px;
        }

        p {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .status {
            display: inline-block;
            color: #16a34a;
            background: #dcfce7;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 35px 20px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="icon">🚀</div>
            <h1>Hello World!</h1>
            <p>Successfully deployed on AWS EC2</p>
            <span class="status">● Application Running</span>
        </div>
    </div>
</body>
</html>
